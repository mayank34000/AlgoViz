<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive sorting algorithm visualizer — watch Bubble, Merge, Quick, Heap and more come to life." />
  <title>SortViz — Sorting Algorithm Visualizer</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Styles — order matters -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/controls.css" />
  <link rel="stylesheet" href="css/visualizer.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

<div id="app">

  <!-- ─── Sidebar ──────────────────────────────────────────────── -->
  <aside id="sidebar" role="complementary" aria-label="Controls">

    <div class="sidebar-header">
      <h1 class="app-title">Sort<span>Viz</span></h1>
      <p class="app-subtitle">Algorithm Visualizer</p>
    </div>

    <div class="sidebar-body">

      <!-- Algorithm selector -->
      <div class="ctrl-section">
        <label class="ctrl-label" for="algo-select">Algorithm</label>
        <select id="algo-select" class="algo-select" aria-label="Select sorting algorithm">
          <!-- Options populated by JS -->
        </select>
      </div>

      <!-- Array type -->
      <div class="ctrl-section">
        <div class="ctrl-label">Array Type</div>
        <div class="array-type-grid" role="group" aria-label="Array type">
          <button class="array-type-btn active" data-type="random"          aria-pressed="true">Random</button>
          <button class="array-type-btn"        data-type="nearly_sorted"   aria-pressed="false">Nearly Sorted</button>
          <button class="array-type-btn"        data-type="reverse"         aria-pressed="false">Reversed</button>
          <button class="array-type-btn"        data-type="few_unique"      aria-pressed="false">Few Unique</button>
          <button class="array-type-btn"        data-type="duplicate_heavy" aria-pressed="false">Duplicate Heavy</button>
        </div>
      </div>

      <!-- Array size -->
      <div class="ctrl-section">
        <div class="slider-group">
          <div class="slider-header">
            <span class="slider-title">Array Size</span>
            <span class="slider-value" id="slider-size-val">50</span>
          </div>
          <input
            type="range"
            id="slider-size"
            min="4"
            max="200"
            value="50"
            step="1"
            aria-label="Array size"
            aria-valuemin="4"
            aria-valuemax="200"
            aria-valuenow="50"
          />
        </div>
      </div>

      <!-- Speed -->
      <div class="ctrl-section">
        <div class="slider-group">
          <div class="slider-header">
            <span class="slider-title">Speed</span>
            <span class="slider-value" id="slider-speed-val">50</span>
          </div>
          <input
            type="range"
            id="slider-speed"
            min="1"
            max="100"
            value="50"
            step="1"
            aria-label="Animation speed"
          />
        </div>
      </div>

      <!-- Action buttons -->
      <div class="ctrl-section">
        <div class="btn-group">
          <button id="btn-generate" class="btn btn-secondary" aria-label="Generate new array">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><polyline points="23 20 23 14 17 14"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
            Generate Array
          </button>

          <button id="btn-start" class="btn btn-primary" aria-label="Start sorting">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Start
            <span class="kbd">Space</span>
          </button>

          <div class="btn-row">
            <button id="btn-pause" class="btn btn-secondary" disabled aria-label="Pause">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
              Pause
            </button>
            <button id="btn-resume" class="btn btn-secondary" disabled aria-label="Resume">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              Resume
            </button>
          </div>

          <div class="btn-row">
            <button id="btn-stop" class="btn btn-danger" disabled aria-label="Stop sorting">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
              Stop
            </button>
            <button id="btn-reset" class="btn btn-secondary" aria-label="Reset">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              Reset
              <span class="kbd">R</span>
            </button>
          </div>
        </div>
      </div>

    </div><!-- /sidebar-body -->

    <div class="sidebar-footer">
      <p class="shortcut-hint">
        <span class="kbd">Space</span> play/pause &nbsp;
        <span class="kbd">R</span> reset &nbsp;
        <span class="kbd">G</span> generate
      </p>
    </div>

  </aside><!-- /sidebar -->

  <!-- Mobile sidebar overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- ─── Main content ──────────────────────────────────────── -->
  <div id="main">

    <!-- Header -->
    <header id="header">
      <div class="header-left">
        <button class="icon-btn mobile-menu-btn" id="btn-mobile-menu" aria-label="Open menu" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <span class="header-algo-label">Sorting with</span>
        <span class="header-algo-badge" id="header-algo-badge"></span>
      </div>

      <div class="header-right">
        <span id="stat-status" class="status-badge status-idle">Idle</span>

        <button
          id="btn-theme"
          class="icon-btn"
          aria-label="Switch to light mode"
          title="Toggle theme (T)"
        >
          <!-- Moon icon (shown in dark mode) -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <button
          id="btn-fullscreen"
          class="icon-btn"
          aria-label="Enter fullscreen"
          title="Fullscreen (F)"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
    </header>

    <!-- Visualizer -->
    <section id="visualizer-area" aria-label="Sorting visualization">
      <div id="bar-container" role="img" aria-label="Bar chart representing the array being sorted"></div>
    </section>

    <!-- Color legend -->
    <div id="color-legend" aria-label="Color key">
      <span class="legend-item"><span class="legend-dot default"></span>Default</span>
      <span class="legend-item"><span class="legend-dot compare"></span>Comparing</span>
      <span class="legend-item"><span class="legend-dot swap"></span>Swapping</span>
      <span class="legend-item"><span class="legend-dot pivot"></span>Pivot</span>
      <span class="legend-item"><span class="legend-dot overwrite"></span>Overwrite</span>
      <span class="legend-item"><span class="legend-dot sorted"></span>Sorted</span>
    </div>

    <!-- Stats row -->
    <div id="stats-row" role="region" aria-label="Algorithm statistics">
      <div class="stat-cell">
        <span class="stat-label">Algorithm</span>
        <span class="stat-value" id="stat-algorithm">—</span>
      </div>
      <div class="stat-cell stat-highlight">
        <span class="stat-label">Comparisons</span>
        <span class="stat-value" id="stat-comparisons">0</span>
      </div>
      <div class="stat-cell stat-highlight">
        <span class="stat-label">Swaps</span>
        <span class="stat-value" id="stat-swaps">0</span>
      </div>
      <div class="stat-cell stat-highlight">
        <span class="stat-label">Writes</span>
        <span class="stat-value" id="stat-writes">0</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Time</span>
        <span class="stat-value" id="stat-elapsed">0ms</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Array Size</span>
        <span class="stat-value" id="stat-array-size">50</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Best Case</span>
        <span class="stat-value" id="stat-best">—</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Average</span>
        <span class="stat-value" id="stat-average">—</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Worst Case</span>
        <span class="stat-value" id="stat-worst">—</span>
      </div>
      <div class="stat-cell">
        <span class="stat-label">Space</span>
        <span class="stat-value" id="stat-space">—</span>
      </div>
    </div>

    <!-- Description panel -->
    <section id="description-panel" aria-label="Algorithm description">
      <!-- Content injected by description.js -->
    </section>

  </div><!-- /main -->

</div><!-- /app -->

<script type="module" src="js/app.js"></script>
</body>
</html>
